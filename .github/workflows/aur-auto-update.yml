name: Auto update AUR packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to update
        required: true
        default: all
        type: choice
        options:
          - all
          - rebased-bin
          - rebased-zh-bin
          - keyviz-zh-bin
          - emeditor-wine
          - navicat17-premium-cs
          - wuyou-docs-bin
          - wuyou-toolkit-bin
          - mind-elixir-bin
          - ccgui-bin
          - zcode-desktop-bin
          - mastergo-desktop-bin
          - pilauncher-bin
          - minimax-hub-bin
          - reasonix-desktop-deb
          - reeden-bin
          - alexandria-bin
          - so-novel-bin
  push:
    paths:
      - ".github/workflows/aur-auto-update.yml"
      - "scripts/**"
      - "packages/rebased-bin/**"
      - "packages/rebased-zh-bin/**"
      - "packages/keyviz-zh-bin/**"
      - "packages/emeditor-wine/**"
      - "packages/navicat17-premium-cs/**"
      - "packages/wuyou-docs-bin/**"
      - "packages/wuyou-toolkit-bin/**"
      - "packages/mind-elixir-bin/**"
      - "packages/ccgui-bin/**"
      - "packages/zcode-desktop-bin/**"
      - "packages/mastergo-desktop-bin/**"
      - "packages/pilauncher-bin/**"
      - "packages/minimax-hub-bin/**"
      - "packages/reasonix-desktop-deb/**"
      - "packages/reeden-bin/**"
      - "packages/alexandria-bin/**"
      - "packages/so-novel-bin/**"
  schedule:
    - cron: "13 0 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel curl git jq openssh ripgrep
          useradd -m builder

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare workspace
        run: |
          chown -R builder:builder "${GITHUB_WORKSPACE}"

      - name: Configure SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          test -n "${AUR_SSH_PRIVATE_KEY}"
          install -dm700 /home/builder/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > /home/builder/.ssh/aur
          chmod 600 /home/builder/.ssh/aur
          ssh-keyscan aur.archlinux.org >> /home/builder/.ssh/known_hosts
          {
            printf 'Host aur.archlinux.org\n'
            printf '  User aur\n'
            printf '  IdentityFile /home/builder/.ssh/aur\n'
            printf '  IdentitiesOnly yes\n'
            printf '  BatchMode yes\n'
          } > /home/builder/.ssh/config
          chown -R builder:builder /home/builder/.ssh

      - name: Configure git
        run: |
          runuser -u builder -- git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          runuser -u builder -- git config --global user.name "duanluan"
          runuser -u builder -- git config --global user.email "duanluan@outlook.com"

      - name: Update package files
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE: ${{ github.event.inputs.package || 'all' }}
        shell: bash
        run: |
          if [[ "${PACKAGE}" == "all" ]]; then
            runuser -u builder -- env GITHUB_TOKEN="${GITHUB_TOKEN}" ./scripts/update-packages.sh
          else
            runuser -u builder -- env GITHUB_TOKEN="${GITHUB_TOKEN}" ./scripts/update-packages.sh "${PACKAGE}"
          fi

      - name: Commit package files
        env:
          PACKAGE: ${{ github.event.inputs.package || 'all' }}
        shell: bash
        run: |
          if [[ "${PACKAGE}" == "all" ]]; then
            status_path="packages"
            commit_message="chore: auto update AUR packages"
            no_changes_message="no package file changes"
          else
            status_path="packages/${PACKAGE}"
            commit_message="chore: auto update ${PACKAGE}"
            no_changes_message="no ${PACKAGE} package file changes"
          fi

          status="$(runuser -u builder -- git status --short -- "${status_path}")"
          if [[ -n "${status}" ]]; then
            runuser -u builder -- git add "${status_path}"
            runuser -u builder -- git commit -m "${commit_message}"
            runuser -u builder -- git push
          else
            printf '%s\n' "${no_changes_message}"
          fi

      - name: Publish to AUR
        env:
          PACKAGE: ${{ github.event.inputs.package || 'all' }}
        shell: bash
        run: |
          if [[ "${PACKAGE}" == "all" ]]; then
            runuser -u builder -- ./scripts/sync-aur-packages.sh
          else
            runuser -u builder -- ./scripts/sync-aur-packages.sh "${PACKAGE}"
          fi
