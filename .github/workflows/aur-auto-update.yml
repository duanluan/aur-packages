name: Auto update AUR packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to update
        required: true
        default: all
        type: choice
        options:
          - all
          - daily
          - weekly
          - rebased-bin
          - rebased-zh-bin
          - keyviz-zh
          - emeditor-wine
          - navicat17-premium-cs
          - wuyou-docs
          - wuyou-toolkit
          - mind-elixir
          - ccgui-bin
          - codeg-bin
          - codepilot-bin
          - gooeypi-bin
          - zcode
          - mastergo
          - pilauncher-bin
          - pideck-bin
          - minimax-hub
          - reasonix-desktop-bin
          - pi-agent-desktop-bin
          - reeden
          - alexandria-bin
          - android-dex-bin
          - so-novel-bin
  push:
    paths:
      - ".github/workflows/aur-auto-update.yml"
      - "scripts/**"
      - "packages/rebased-bin/**"
      - "packages/rebased-zh-bin/**"
      - "packages/keyviz-zh/**"
      - "packages/emeditor-wine/**"
      - "packages/navicat17-premium-cs/**"
      - "packages/wuyou-docs/**"
      - "packages/wuyou-toolkit/**"
      - "packages/mind-elixir/**"
      - "packages/ccgui-bin/**"
      - "packages/codeg-bin/**"
      - "packages/codepilot-bin/**"
      - "packages/gooeypi-bin/**"
      - "packages/zcode/**"
      - "packages/mastergo/**"
      - "packages/pilauncher-bin/**"
      - "packages/pideck-bin/**"
      - "packages/minimax-hub/**"
      - "packages/reasonix-desktop-bin/**"
      - "packages/pi-agent-desktop-bin/**"
      - "packages/reeden/**"
      - "packages/alexandria-bin/**"
      - "packages/android-dex-bin/**"
      - "packages/so-novel-bin/**"
  schedule:
    - cron: "43 0 * * *"
    - cron: "13 0 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel curl git jq openssh ripgrep unzip zip
          useradd -m builder

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare workspace
        run: |
          chown -R builder:builder "${GITHUB_WORKSPACE}"

      - name: Configure SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          test -n "${AUR_SSH_PRIVATE_KEY}"
          install -dm700 /home/builder/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > /home/builder/.ssh/aur
          chmod 600 /home/builder/.ssh/aur
          ssh-keyscan aur.archlinux.org >> /home/builder/.ssh/known_hosts
          {
            printf 'Host aur.archlinux.org\n'
            printf '  User aur\n'
            printf '  IdentityFile /home/builder/.ssh/aur\n'
            printf '  IdentitiesOnly yes\n'
            printf '  BatchMode yes\n'
          } > /home/builder/.ssh/config
          chown -R builder:builder /home/builder/.ssh

      - name: Configure git
        run: |
          runuser -u builder -- git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          runuser -u builder -- git config --global user.name "duanluan"
          runuser -u builder -- git config --global user.email "duanluan@outlook.com"

      - name: Resolve package set
        id: package-set
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_PACKAGE: ${{ github.event.inputs.package || 'all' }}
        shell: bash
        run: |
          daily_packages=(
            rebased-bin
            rebased-zh-bin
            ccgui-bin
            codeg-bin
            codepilot-bin
            gooeypi-bin
            zcode
            minimax-hub
            reasonix-desktop-bin
            pi-agent-desktop-bin
            pilauncher-bin
            pideck-bin
          )
          weekly_packages=(
            keyviz-zh
            emeditor-wine
            navicat17-premium-cs
            wuyou-docs
            wuyou-toolkit
            mind-elixir
            mastergo
            reeden
            alexandria-bin
            android-dex-bin
            so-novel-bin
          )

          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            case "${EVENT_SCHEDULE}" in
              "43 0 * * *")
                packages=("${daily_packages[@]}")
                label="daily"
                ;;
              "13 0 * * 1")
                packages=("${weekly_packages[@]}")
                label="weekly"
                ;;
              *)
                printf 'unknown schedule: %s\n' "${EVENT_SCHEDULE}" >&2
                exit 1
                ;;
            esac
          else
            case "${INPUT_PACKAGE}" in
              all)
                packages=("${daily_packages[@]}" "${weekly_packages[@]}")
                label="all"
                ;;
              daily)
                packages=("${daily_packages[@]}")
                label="daily"
                ;;
              weekly)
                packages=("${weekly_packages[@]}")
                label="weekly"
                ;;
              *)
                packages=("${INPUT_PACKAGE}")
                label="${INPUT_PACKAGE}"
                ;;
            esac
          fi

          for package in "${packages[@]}"; do
            if [[ ! -d "packages/${package}" ]]; then
              printf 'unknown package: %s\n' "${package}" >&2
              exit 1
            fi
          done

          {
            printf 'label=%s\n' "${label}"
            printf 'packages=%s\n' "${packages[*]}"
          } >> "${GITHUB_OUTPUT}"

          printf 'selected package set: %s\n' "${label}"
          printf 'packages: %s\n' "${packages[*]}"

      - name: Update package files
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE_SET: ${{ steps.package-set.outputs.packages }}
        shell: bash
        run: |
          read -r -a packages <<<"${PACKAGE_SET}"
          successful_packages=()
          failed_packages=()

          for package in "${packages[@]}"; do
            if runuser -u builder -- env GITHUB_TOKEN="${GITHUB_TOKEN}" ./scripts/update-packages.sh "${package}"; then
              successful_packages+=("${package}")
            else
              printf 'failed update %s\n' "${package}" >&2
              failed_packages+=("${package}")
            fi
          done

          updated_packages=()
          for package in "${successful_packages[@]}"; do
            if [[ -n "$(runuser -u builder -- git status --short -- "packages/${package}")" ]]; then
              updated_packages+=("${package}")
            fi
          done

          {
            printf 'successful_packages=%s\n' "${successful_packages[*]}"
            printf 'updated_packages=%s\n' "${updated_packages[*]}"
            printf 'failed_packages=%s\n' "${failed_packages[*]}"
          } >> "${GITHUB_OUTPUT}"

          printf 'packages with file changes: %s\n' "${updated_packages[*]:-none}"

          if [[ "${#failed_packages[@]}" -gt 0 ]]; then
            printf 'packages with update failures: %s\n' "${failed_packages[*]}" >&2
            {
              printf '### Package update failures\n\n'
              printf '%s\n' "${failed_packages[@]}" | sed 's/^/- /'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Commit package files
        env:
          PACKAGE_LABEL: ${{ steps.package-set.outputs.label }}
          PACKAGE_SET: ${{ steps.update.outputs.updated_packages }}
        shell: bash
        run: |
          if [[ -z "${PACKAGE_SET}" ]]; then
            printf 'no package file changes\n'
            exit 0
          fi

          read -r -a packages <<<"${PACKAGE_SET}"
          status_paths=()
          for package in "${packages[@]}"; do
            status_paths+=("packages/${package}")
          done

          if [[ "${PACKAGE_LABEL}" == "all" ]]; then
            commit_message="chore: auto update AUR packages"
            no_changes_message="no package file changes"
          elif [[ "${PACKAGE_LABEL}" == "daily" || "${PACKAGE_LABEL}" == "weekly" ]]; then
            commit_message="chore: auto update ${PACKAGE_LABEL} AUR packages"
            no_changes_message="no ${PACKAGE_LABEL} package file changes"
          else
            commit_message="chore: auto update ${PACKAGE_LABEL}"
            no_changes_message="no ${PACKAGE_LABEL} package file changes"
          fi

          status="$(runuser -u builder -- git status --short -- "${status_paths[@]}")"
          if [[ -n "${status}" ]]; then
            runuser -u builder -- git add "${status_paths[@]}"
            runuser -u builder -- git commit -m "${commit_message}"
            runuser -u builder -- git push
          else
            printf '%s\n' "${no_changes_message}"
          fi

      - name: Publish to AUR
        env:
          PACKAGE_SET: ${{ steps.update.outputs.successful_packages }}
        shell: bash
        run: |
          if [[ -z "${PACKAGE_SET}" ]]; then
            printf 'no package changes to publish\n'
            exit 0
          fi

          read -r -a packages <<<"${PACKAGE_SET}"
          failed_packages=()

          for package in "${packages[@]}"; do
            if runuser -u builder -- ./scripts/sync-aur-packages.sh "${package}"; then
              continue
            fi

            printf 'failed publish %s\n' "${package}" >&2
            failed_packages+=("${package}")
          done

          if [[ "${#failed_packages[@]}" -gt 0 ]]; then
            printf 'packages with publish failures: %s\n' "${failed_packages[*]}" >&2
            {
              printf '### Package publish failures\n\n'
              printf '%s\n' "${failed_packages[@]}" | sed 's/^/- /'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
