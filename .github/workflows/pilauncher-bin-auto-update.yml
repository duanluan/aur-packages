name: Auto update pilauncher-bin

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/pilauncher-bin-auto-update.yml"
      - "scripts/**"
      - "packages/pilauncher-bin/**"
  schedule:
    - cron: "29 0 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel curl git jq openssh ripgrep
          useradd -m builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"

      - name: Configure SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          test -n "${AUR_SSH_PRIVATE_KEY}"
          install -dm700 /home/builder/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > /home/builder/.ssh/aur
          chmod 600 /home/builder/.ssh/aur
          ssh-keyscan aur.archlinux.org >> /home/builder/.ssh/known_hosts
          {
            printf 'Host aur.archlinux.org\n'
            printf '  User aur\n'
            printf '  IdentityFile /home/builder/.ssh/aur\n'
            printf '  IdentitiesOnly yes\n'
            printf '  BatchMode yes\n'
          } > /home/builder/.ssh/config
          chown -R builder:builder /home/builder/.ssh

      - name: Configure git
        run: |
          runuser -u builder -- git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          runuser -u builder -- git config --global user.name "duanluan"
          runuser -u builder -- git config --global user.email "duanluan@outlook.com"

      - name: Update package files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: runuser -u builder -- env GITHUB_TOKEN="${GITHUB_TOKEN}" ./scripts/update-packages.sh pilauncher-bin

      - name: Commit package files
        run: |
          runuser -u builder -- bash -c '
            if [[ -n "$(git status --short -- packages/pilauncher-bin)" ]]; then
              git add packages/pilauncher-bin
              git commit -m "chore: auto update pilauncher-bin"
              git push
            else
              printf "no pilauncher-bin package file changes\n"
            fi
          '

      - name: Publish to AUR
        run: runuser -u builder -- ./scripts/sync-aur-packages.sh pilauncher-bin
